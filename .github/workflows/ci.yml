name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  mock-romm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dev/mock-romm/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r dev/mock-romm/requirements-dev.txt

      # Test environment's mock RomM API (see dev/README.md). Has its own pytest config in
      # dev/mock-romm/pyproject.toml, so the backend's --cov addopts don't apply.
      - name: Test mock RomM
        run: python -m pytest dev/mock-romm -q

      # Validates the test-env compose file (all profiles) without starting anything, using
      # the committed example as the env file (placeholder values are fine for `config`).
      - name: Validate test-env compose file
        run: |
          cp dev/.env.test.example dev/.env.test
          docker compose -f dev/docker-compose.test.yml --env-file dev/.env.test --profile real-romm config -q

  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build-only, no push — confirms the multi-stage build (frontend build stage +
      # backend runtime stage, see ../../Dockerfile) actually succeeds.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
