name: Release

# Manual semantic version tags, not automated commit-driven versioning — a single-maintainer
# project doesn't get much from changesets/semantic-release's automation, and it'd mean
# adopting a commit message convention just to support tooling. You decide when to cut a
# release:
#
#   git tag v1.2.0
#   git push origin v1.2.0
#
# That push is the only thing that triggers this workflow.

on:
  push:
    tags:
      - "v*"

# contents: write is for the GitHub Release created at the end; packages: write pushes the
# image to GHCR with the built-in GITHUB_TOKEN (no registry secrets needed).
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          # ghcr.io/<owner>/sleepoverr. GHCR image names must be lowercase; the owner's name
          # isn't guaranteed to be.
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/sleepoverr"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 for typical servers/desktops, linux/arm64 for Raspberry Pi 4/5 and
          # other 64-bit ARM boards (Apple Silicon under Docker Desktop, etc). QEMU (above)
          # emulates the foreign arch during build since this runner is amd64-only.
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.ghcr_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.ghcr_image }}:latest
          # Links the GHCR package to this repo (its page, README and permissions).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Sleepoverr
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
